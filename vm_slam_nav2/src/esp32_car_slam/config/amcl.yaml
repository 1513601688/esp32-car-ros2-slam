amcl:
  ros__parameters:
    use_sim_time: false

    # 坐标系与输入话题。/scan_slam 是 LD14 固定 360 点的归一化扫描。
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan_slam

    # 麦克纳姆底盘能够横向运动，必须使用全向运动模型。
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # LD14 的有效测距与激光似然场模型。
    laser_model_type: likelihood_field
    laser_min_range: 0.05
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2

    # 初期采用较密的粒子，并让短距离移动也能触发更新，方便现场验证。
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # AMCL 发布 map -> odom；初始位姿由 RViz 的“2D Pose Estimate”给出。
    tf_broadcast: true
    transform_tolerance: 1.0
    set_initial_pose: false
    always_reset_initial_pose: false
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: map
    yaml_filename: ""
